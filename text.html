<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sayang ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:
    radial-gradient(circle at top,#ff8fc7,#ff4f9a,#6f4bff);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Bintang */
.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:blink 2s infinite alternate;
}

@keyframes blink{
    from{opacity:0.2;}
    to{
        opacity:1;
        box-shadow:0 0 10px white;
    }
}

/* Love jatuh */
.heart{
    position:absolute;
    color:#fff;
    animation:fall linear forwards;
    top:-20px;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
    }
}

/* Card */
.card{
    position:relative;
    z-index:10;
    width:90%;
    max-width:750px;
    padding:40px;
    text-align:center;
    border-radius:35px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 0 30px rgba(255,255,255,0.2);
    animation:fade 2s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.photo{
    width:170px;
    height:170px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid white;
    box-shadow:0 0 30px rgba(255,255,255,0.5);
    margin-bottom:20px;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

h1{
    font-size:50px;
    color:white;
    text-shadow:0 0 20px rgba(255,255,255,0.8);
}

h2{
    margin-top:10px;
    color:#ffe2f0;
    font-weight:300;
}

.message{
    margin-top:25px;
    color:white;
    font-size:20px;
    line-height:1.8;
}

.typing{
    overflow:hidden;
    white-space:nowrap;
    border-right:3px solid white;
    width:0;
    margin:auto;
    animation:
    typing 5s steps(40,end) forwards,
    blinkCursor .8s infinite;
}

@keyframes typing{
    from{width:0}
    to{width:100%}
}

@keyframes blinkCursor{
    50%{
        border-color:transparent;
    }
}

button{
    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:white;
    color:#ff2f7b;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 20px rgba(255,255,255,0.4);
}

button:hover{
    transform:scale(1.08);
    background:#ffe0ef;
}

.loveText{
    margin-top:25px;
    font-size:24px;
    color:#fff;
    opacity:0;
    transition:1s;
    text-shadow:0 0 15px white;
}

.show{
    opacity:1;
}

</style>
</head>
<body>

<!-- Musik -->
<audio id="music" loop>
    <source src="https://files.catbox.moe/4f6d6x.mp3" type="audio/mp3">
</audio>

<!-- Card -->
<div class="card">

    <!-- FOTO PACAR -->
    <img src="https://i.imgur.com/8Km9tLL.jpg" class="photo">

    <h1>Happy Birthday ❤️</h1>

    <h2>Untuk Kamu Yang Paling Aku Sayang</h2>

    <div class="message">
        <p class="typing">
            Semoga semua harapanmu menjadi kenyataan ✨
        </p>

        <p style="margin-top:20px;">
            Terima kasih karena sudah hadir di hidupku.  
            Kamu adalah alasan kenapa hariku terasa indah.  
            Semoga kita selalu bersama sampai kapanpun 💖
        </p>
    </div>

    <button onclick="playLove()">
        Klik Disini 💌
    </button>

    <div id="loveText" class="loveText">
        Aku Sayang Kamu Selamanya ❤️
    </div>

</div>

<script>

/* Musik + pesan */
function playLove(){

    const music = document.getElementById("music");

    music.play();

    document.getElementById("loveText")
    .classList.add("show");

}

/* Love jatuh */
function createHeart(){

    const heart = document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML = "❤";

    heart.style.left = Math.random()*100+"vw";

    heart.style.fontSize =
    (Math.random()*25+15)+"px";

    heart.style.animationDuration =
    (Math.random()*4+3)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },7000);

}

setInterval(createHeart,250);

/* Bintang */
for(let i=0;i<100;i++){

    let star = document.createElement("div");

    star.classList.add("star");

    star.style.left = Math.random()*100+"vw";

    star.style.top = Math.random()*100+"vh";

    star.style.animationDuration =
    (Math.random()*3+1)+"s";

    document.body.appendChild(star);

}

</script>

</body>
</html>
